[providers]
  node = {}
  python = {}

[phases.setup]
  nixPkgs = ["nodejs", "python311", "gcc"]

[phases.install]
  cmds = ["npm install", "cd 'backend/First project' && python -m venv venv && source venv/bin/activate && pip install -r requirements.txt"]

[phases.build]
  cmds = ["npm run build"]

[start]
  cmd = "cd 'backend/First project' && source venv/bin/activate && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
